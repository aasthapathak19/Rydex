services:
  rydex:
    build:
      context: ./rydex
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_SOCKET_SERVER_URL=http://localhost:5000
    env_file:
      - ./rydex/.env
    depends_on:
      - mongo
      - socket-server
    networks:
      - rydex-network

  socket-server:
    build:
      context: ./socketServer
    ports:
      - "5000:5000"
    env_file:
      - ./socketServer/.env
    depends_on:
      - mongo
    networks:
      - rydex-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - rydex-network

volumes:
  mongo-data:

networks:
  rydex-network:
    driver: bridge
